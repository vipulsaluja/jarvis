[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40.0",
]

[project.scripts]
jarvis = "agent.jarvis:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "tools*"]
